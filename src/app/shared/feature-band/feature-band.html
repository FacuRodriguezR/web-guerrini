<section
    class="relative bg-linear-to-b from-guerrini-gray to-guerrini-dark pb-24 pt-36 [clip-path:polygon(0_0,50%_72px,100%_0,100%_100%,0_100%)] sm:pt-40">
    <div class="mx-auto max-w-6xl px-3 sm:px-6">
        <div class="text-center">
            <h2 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">{{ title() }}</h2>
            <span aria-hidden="true" class="mx-auto mt-4 block h-1 w-12 rounded-full bg-accent"></span>
        </div>

        <ul class="mt-14 grid gap-5 md:grid-cols-3">
            @for (feature of features(); track feature.title) {
            <li
                class="group rounded-3xl border border-white/10 bg-white/5 p-8 backdrop-blur-sm transition-all duration-300 hover:-translate-y-1 hover:border-white/20 hover:bg-white/10">
                <span
                    class="flex size-14 items-center justify-center rounded-2xl bg-accent/15 text-accent ring-1 ring-accent/30 transition-colors duration-300 group-hover:bg-accent group-hover:text-white">
                    <svg class="size-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"
                        aria-hidden="true">
                        @switch (feature.icon) {
                        @case ('check') {
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                        }
                        @case ('tools') {
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 0 0 4.486-6.336l-3.276 3.277a3.004 3.004 0 0 1-2.25-2.25l3.276-3.276a4.5 4.5 0 0 0-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085m-1.745 1.437L5.909 7.5H4.5L2.25 3.75l1.5-1.5L7.5 4.5v1.409l4.26 4.26m-1.745 1.437 1.745-1.437m6.615 8.206L15.75 15.75M4.867 19.125h.008v.008h-.008v-.008Z" />
                        }
                        @case ('award') {
                        <circle cx="12" cy="9" r="5.25" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M8.75 13.25 7.5 21l4.5-2.5 4.5 2.5-1.25-7.75" />
                        }
                        @case ('handshake') {
                        <g stroke-linecap="round" stroke-linejoin="round">
                            <path d="m11 17 2 2a1 1 0 1 0 3-3" />
                            <path
                                d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4" />
                            <path d="m21 3 1 11h-2" />
                            <path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3" />
                            <path d="M3 4h8" />
                        </g>
                        }
                        @case ('star') {
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
                        }
                        }
                    </svg>
                </span>

                <h3 class="mt-6 text-lg font-bold text-white">{{ feature.title }}</h3>
                <p class="mt-3 text-sm leading-relaxed text-white/70">{{ feature.text }}</p>
            </li>
            }
        </ul>

        <ng-content />
    </div>
</section>
